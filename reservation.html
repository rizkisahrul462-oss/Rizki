<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Reservasi Kelas | SmartFit Gym</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/reservation.css">
</head>
<body>

  <h2>Form Reservasi Kelas / Trial Membership</h2>

  <form action="#" method="post">
    
    <label for="nama">Nama Lengkap *</label>
    <input type="text" id="nama" name="nama" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email">

    <label for="hp">Nomor HP</label>
    <input type="tel" id="hp" name="hp" placeholder="08xxxxxxxxxx">

    <label for="tanggal">Tanggal Reservasi</label>
    <input type="date" id="tanggal" name="tanggal">

    <label for="jam">Jam</label>
    <input type="time" id="jam" name="jam">

    <label for="program">Jenis Program</label>
    <select id="program" name="program">
      <option value="">-- Pilih Program --</option>
      <option>Strength Training</option>
      <option>Cardio Burn</option>
      <option>Yoga & Mobility</option>
      <option>Trial Membership</option>
